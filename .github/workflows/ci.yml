name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Backend, frontend, and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: career_copilot_ci_test
          POSTGRES_USER: career_copilot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career_copilot -d career_copilot_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both the app engine and destructive pytest fixtures are confined to
      # this disposable PostgreSQL service. Never add hosted DB credentials.
      CAREER_COPILOT_DATABASE_URL: postgresql+psycopg://career_copilot:ci-only-password@127.0.0.1:5432/career_copilot_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://career_copilot:ci-only-password@127.0.0.1:5432/career_copilot_ci_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.7
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -ra

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-career-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
